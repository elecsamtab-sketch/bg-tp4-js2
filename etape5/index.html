<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CRUD-Persons - Étape 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="table_container">

        <!-- Formulaire de saisie, juste au-dessus du tableau -->
        <div id="form_container">
            <div class="form_group">
                <label class="form_label">Nom:</label>
                <input type="text" id="form_nom" class="form_field"/>
            </div>
            <div class="form_group">
                <label class="form_label">Prénom:</label>
                <input type="text" id="form_prenom" class="form_field"/>
            </div>
            <div class="form_group">
                <label class="form_label">Points:</label>
                <input type="number" id="form_points" class="form_field"/>
            </div>
            <!-- onclick = événement "au clic" (slides 129 à 135) -->
            <button class="btn-add" onclick="doNewData()">Ajouter</button>
        </div>

        <table id="table">
            <thead>
                <tr>
                    <th>N°</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Points</th>
                    <th>Select</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <div id="container_summary">
            <p id="p1">0 ligne(s)</p>
            <p id="p2"></p>
            <p id="p3">Total point(s)= 0</p>
        </div>

        <button onclick="consoleTableau()">Console Tableau</button>
    </div>

    <!-- Méthode 3 : fichier JS externe, placé à la fin du body (slides 23, 24 et 27) -->
    <script src="script.js"></script>
</body>
</html>
